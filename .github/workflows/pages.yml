name: Deploy GitHub Pages

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Reduce html to necessary information (each file was self-contained)
        run: |
          python scripts/externalize_explanations.py
      # NOTE: do NOT rebuild manifest.json in CI. `data/` is gitignored, so the
      # metric sidecars are missing on the runner and `build_manifest.py` would
      # overwrite the committed manifest with one that has empty metrics_summary
      # and no metric_scores — making the "Sort by" dropdown empty in prod.
      # Instead, rely on the manifest.json committed from local builds.
      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp index.html styles.css app.js manifest.json site/
          cp -R explanations site/
          cp -R assets site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
